<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlexPlay">
<meta name="description" content="FlexPlay — multi-sport fixtures manager. Run Americano, Mexicano, leagues, groups and knockouts from your phone.">
<title>FlexPlay — Multi-Sport Fixtures Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app"></div>
<pre id="boot-error" hidden style="white-space:pre-wrap;word-break:break-word;font:12px/1.5 monospace;background:#ffe0d9;border-left:2px solid #ec3013;padding:12px;margin:12px"></pre>
<nav id="tabbar" class="tabbar" hidden></nav>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="js/engines.js?v=12"></script>
<script src="js/store.js?v=12"></script>
<script src="js/ui.js?v=12"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(() => {});
  });
}
window.addEventListener('error', e => {
  const box = document.getElementById('boot-error');
  if (box) {
    box.hidden = false;
    box.textContent = 'Startup error: ' + (e.message || '') + ' — ' + (e.filename || '') + ':' + (e.lineno || '');
  }
});
</script>
</body>
</html>
